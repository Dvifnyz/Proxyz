services:
  proxyz:
    build: .
    container_name: proxyz-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8888}:8888"
    environment:
      - PYTHONUNBUFFERED=1
      # - PROXYZ_TOKEN=isi-token-bila-mau-pakai-token
      # - WEBSHARE_API_KEY=isi-api-key-webshare
    volumes:
      - ./output:/app/output
      - ./config:/app/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8888/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
